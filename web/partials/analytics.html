<!-- 爬取統計分頁。搭配 js/analytics.js(今日進度小區塊由 js/progress.js 的 renderToday 填)。 -->
  <div class="panel hidden" id="panel-analysis">
    <div class="card">
      <h2>今日爬取統計 <span class="hint" id="an-date"></span><i class="info" tabindex="0" data-tip="下方清單只顯示最近 31 天;執行時間欄的「—」表示該日沒有執行時間紀錄。"></i><span class="spinner spinner-sm" id="an-spin" style="display:none;"></span></h2>
      <div class="an-loading" id="an-loading"><div class="spinner"></div><div>載入爬取統計中…</div></div>
      <!-- 今日進度 + 今日統計整合:上方為進度主角(還需/達標 + 進度條 + 今日目標);
           下方那排統計的「檢索筆數」即今日已完成,不再另列「已完成」一次,避免同一數字重複出現。 -->
      <div id="m-today" style="margin:0;">
        <div style="display:flex; align-items:baseline; justify-content:space-between; flex-wrap:wrap; gap:6px 12px; margin-bottom:var(--sp-sm);">
          <span id="t-headline" class="headline">—</span>
          <span id="t-target-wrap" class="meta">今日目標 <b id="t-target" style="color:var(--txt);">—</b> 筆</span>
        </div>
        <div class="bar" style="margin:0;"><div id="t-bar"></div></div>
      </div>
      <div class="mfilter" id="an-filter" style="display:none;"></div>
      <div class="row">
        <div class="stat"><div class="k">檢索筆數</div><div class="v" id="an-q">—</div></div>
        <div class="stat"><div class="k">爬取流量(回應)</div><div class="v" id="an-b">—</div></div>
        <div class="stat"><div class="k">總執行時間</div><div class="v" id="an-t">—</div></div>
        <div class="stat"><div class="k">本機今日總流量</div><div class="v" id="an-m">—</div></div>
      </div>
      <div class="hist-scroll">
        <table>
          <thead><tr><th>日期</th><th class="num">檢索筆數</th><th class="num">爬取流量</th><th class="num">執行時間</th></tr></thead>
          <tbody id="an-hist"></tbody>
        </table>
      </div>
    </div>

    <!-- 本月累計:只算這套工具自己跑掉的檢索(和「檢索進度」頁的本月累積不同 ——
         那邊是後台匯出檔的全站總量、含民眾使用,兩者不該互相對帳)。
         機器篩選(上方的 #an-filter)同樣套用到這張卡。 -->
    <div class="card">
      <h2>本月手動檢索 <span class="hint" id="an-month">—</span><i class="info" tabindex="0" data-tip="只計本工具(API / 傳統檢索)實際送出的檢索,不含後台其他來源與民眾使用;上方的機器篩選同樣有效。"></i></h2>
      <div class="row">
        <div class="stat"><div class="k">檢索筆數</div><div class="v" id="an-mq">—</div></div>
        <div class="stat"><div class="k">爬取流量(回應)</div><div class="v" id="an-mb">—</div></div>
        <div class="stat"><div class="k">總執行時間</div><div class="v" id="an-mt">—</div></div>
      </div>
    </div>

    <div class="card">
      <h2>API 用量 <span class="hint" id="q-seg">—</span></h2>
      <div id="an-apicard"></div>
    </div>
  </div>
