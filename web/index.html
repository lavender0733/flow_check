<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>流量監控</title>
<!-- 外觀切換。這段必須在 <head> 內同步執行(不能搬進 js/,也不能加 defer):
     頁面一開始畫之前就要把正確的 CSS 掛上,晚一步會先閃一下預設色再跳成使用者選的。
     另外 core/routes.py 只載入「有配對 partials/xxx.html」的 js,單獨一支 theme.js
     不會被注入,所以這段就放在這裡。選單本身由下方 #themepick 的 script 生成。
     選擇同時存 localStorage(擋開頁閃色)與伺服器偏好(換瀏覽器仍在,伺服器為準)。 -->
<link rel="stylesheet" href="style.css" id="themecss">
<script>
// 三種外觀:深色(預設)、淺色、原版。前兩者共用 style.css(靠 <html data-theme> 切換
// token),原版是換掉整支 CSS 檔 —— 它是套用新樣式前的設計,完整保留在 style-classic.css。
var THEMES = [
  { id: "dark",    label: "深色",  css: "style.css",         attr: "dark"  },
  { id: "light",   label: "淺色",  css: "style.css",         attr: "light" },
  { id: "classic", label: "原版",  css: "style-classic.css", attr: ""      },
];
// 目前套用中的外觀 id。給 loadMonitorConfig 判斷「伺服器沒存過時要種哪個值」用。
function currentTheme() {
  var attr = document.documentElement.getAttribute("data-theme");
  var css = document.getElementById("themecss").getAttribute("href");
  var t = THEMES.find(function (x) { return x.css === css && x.attr === (attr || ""); });
  return (t || THEMES[0]).id;
}
// 套用外觀。save=false 用於「從伺服器讀回來的值」—— 那是既有設定,不需要再寫回去。
function applyTheme(id, save) {
  var t = THEMES.find(function (x) { return x.id === id; }) || THEMES[0];
  var link = document.getElementById("themecss");
  // 只在真的換檔時才改 href:重設成同一個值會讓瀏覽器重新抓一次 CSS,畫面閃一下。
  if (link && link.getAttribute("href") !== t.css) link.setAttribute("href", t.css);
  if (t.attr) document.documentElement.setAttribute("data-theme", t.attr);
  else document.documentElement.removeAttribute("data-theme");
  // 回頭同步選單:設 select 的值,自繪按鈕與勾選由 enhanceSelect 的
  // MutationObserver/refreshPicker 跟上(開頁最早期呼叫時選單還沒建好,略過)。
  var sel = document.getElementById("themesel");
  if (sel && sel.value !== t.id) {
    sel.value = t.id;
    if (sel.refreshPicker) sel.refreshPicker();
  }

  if (save !== false) {
    // localStorage:下次開頁在第一個位元組畫出來之前就讀得到,用來擋換色閃爍。
    try { localStorage.setItem("theme", t.id); } catch (e) {}
    // 伺服器:跟著本機偏好檔走(prefs_<機器>.json),換瀏覽器或清快取後仍在。
    // 失敗不擋事 —— 外觀已經套用了,localStorage 也還留著。
    try {
      fetch("/api/prefs", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ theme: t.id }),
      }).catch(function () {});
    } catch (e) {}
  }

  // favicon 用 canvas 畫,吃的是解析後的色值而不是 var() → 換外觀後要重畫一次。
  // 換 CSS 檔時瀏覽器是非同步載入的,得等它套用後再畫,否則會拿到舊配色;
  // 用兩層 rAF 等「下一次真正繪製之後」,比固定 setTimeout 可靠。
  if (window.repaintFavicon) {
    requestAnimationFrame(function () {
      requestAnimationFrame(function () { window.repaintFavicon(); });
    });
  }
}
// 開頁時先用 localStorage 的值把 CSS 掛上(同步,趕在第一次繪製之前,不閃色)。
// 伺服器的偏好稍後由 loadMonitorConfig 帶回來覆寫 —— 伺服器為準,localStorage 只是預填。
// 兩者一致時 applyTheme 會發現 href 沒變,不會重新載入 CSS。
(function () {
  var saved = null;
  try { saved = localStorage.getItem("theme"); } catch (e) {}
  var t = THEMES.find(function (x) { return x.id === saved; }) || THEMES[0];
  document.getElementById("themecss").setAttribute("href", t.css);
  if (t.attr) document.documentElement.setAttribute("data-theme", t.attr);
})();
</script>
</head>
<body>
<!-- 這個檔是外殼。各分頁(panel)拆成 partials/*.html,由伺服器送頁時掃目錄注入,
     對應的 js 也一併產生 script 標籤(見 core/routes.py 的 render_index)。
     加一個頁籤 = 丟 partials/xxx.html + js/xxx.js 兩個新檔,這個檔不用改。 -->
<div class="wrap">

  <div id="restartbanner" class="banner banner-info" style="display:none;">
    🔄 偵測到程式碼已更新,但目前執行中的還是舊版本 —— 請到執行視窗按 Ctrl+C 關掉再重新啟動,變更才會生效。
  </div>

  <div id="healthbanner" class="banner banner-danger banner-x" onclick="dismissHealth()"
       title="點此關閉(再有新錯誤會重新跳出)" style="display:none;"></div>

  <!-- 頁籤按鈕列由 main.js 依 util.js 的 TABS 註冊表生成;外觀選單靠右擺同一排。 -->
  <div class="tabbar">
    <div class="tabs" id="tabs"></div>
    <!-- 外觀選單。用 util.js 的自繪選單(見 enhanceSelect 與 style.css 的 .picker)——
         原生 select 的展開面板由系統畫,樣式對不起來。這裡放原生 select 當骨架,選項由下方 script 填。 -->
    <div class="picker themepick" id="themepick">
      <select id="themesel" data-picker data-picker-head="外觀" aria-label="外觀"
              onchange="applyTheme(this.value)"></select>
    </div>
  </div>
  <script>
  // 選項依上面的 THEMES 產生 —— 加一種外觀只要往那個陣列加一筆,這裡不用改。
  (function () {
    var sel = document.getElementById("themesel");
    var cur = null;
    try { cur = localStorage.getItem("theme"); } catch (e) {}
    if (!THEMES.some(function (t) { return t.id === cur; })) cur = THEMES[0].id;
    THEMES.forEach(function (t) {
      var o = document.createElement("option");
      o.value = t.id;
      o.textContent = t.label;
      sel.appendChild(o);
    });
    sel.value = cur;
    // 這個 select 之後由 util.js 的 enhanceAllSelects 換成自繪選單
    // (它在 body 末尾載入,晚於這裡;#themepick 已是 .picker,會被直接沿用)。
  })();
  </script>

  <!--#include-partials-->

  <div class="hint" style="text-align:center; padding:4px 0 2px;">系統版本 v<!--#version--></div>

</div>

<!-- JS 依功能切分,採傳統 <script>(共用全域作用域,onclick 照常運作,免打包工具)。
     下面這個標記由伺服器換成實際的 script 標籤:util 最先(它定義 registerTab)、
     main 最後(啟動),中間是各頁籤模組,依 partials 檔名字母序。 -->
<!--#include-scripts-->
</body>
</html>
