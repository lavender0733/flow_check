<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>流量監控 + GPSS 控制台</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<!-- 各分頁(panel)拆成 partials/*.html。下方每個 include 標記由伺服器送頁時換成該檔內容。
     要單獨抽出某頁,直接拿對應的 partials 檔 + js 模組即可。 -->
<div id="goalfx"></div>
<div id="goaltoast">🎉 今日檢索達標!</div>
<div class="wrap">

  <div id="warnbanner" class="banner banner-warn banner-x" onclick="dismissWarn()"
       title="點此關閉(同一則警告不再跳;警告解除或換新內容會再顯示)" style="display:none;"></div>

  <div id="restartbanner" class="banner banner-info" style="display:none;">
    🔄 偵測到程式碼已更新,但目前執行中的還是舊版本 —— 請到執行視窗按 Ctrl+C 關掉再重新啟動,變更才會生效。
  </div>

  <div id="healthbanner" class="banner banner-danger banner-x" onclick="dismissHealth()"
       title="點此關閉(再有新錯誤會重新跳出)" style="display:none;"></div>

  <div class="tabs">
    <button class="tab on" id="tab-monitor" onclick="showTab('monitor')">流量監控</button>
    <button class="tab" id="tab-control" onclick="showTab('control')">檢索控制台</button>
    <button class="tab" id="tab-analysis" onclick="showTab('analysis')">爬取統計</button>
    <button class="tab" id="tab-calc" onclick="showTab('calc')">檢索進度</button>
  </div>

  <!--#include partials/monitor.html-->

  <!--#include partials/control.html-->

  <!--#include partials/analytics.html-->

  <!--#include partials/progress.html-->

  <div class="hint" style="text-align:center; padding:4px 0 2px;">系統版本 v<!--#version--></div>

</div>

<!-- JS 依功能切分,採傳統 <script>(共用全域作用域,onclick 照常運作,免打包工具)。
     載入順序即相依順序:util 最先、main 最後(啟動)。流量監控集中在 monitor.js,
     需單獨抽出時搬 monitor.js + partials/monitor.html 即可。 -->
<script src="js/util.js"></script>
<script src="js/monitor.js"></script>
<script src="js/control.js"></script>
<script src="js/analytics.js"></script>
<script src="js/progress.js"></script>
<script src="js/main.js"></script>
</body>
</html>
