<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>年度檢索統計</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="wrap">
    <header class="page-head">
      <h1><span id="year">—</span>檢索統計</h1>
      <button class="refresh" type="button" onclick="refreshStats()">更新統計</button>
    </header>

    <section class="card overview-card">
      <div class="chart-area">
        <div class="pie" id="system-pie" role="img" aria-label="各系統相對年度目標的檢索次數圓餅圖">
          <div class="pie-hole"><b id="percent">—</b><span>完成率</span></div>
        </div>
        <div class="pie-legend" id="pie-legend"></div>
      </div>
      <div class="annual-summary">
        <div><span>年度累積</span><b id="total">—</b><small>次</small></div>
        <div><span>年度目標</span><b id="target">—</b><small>次</small></div>
        <div><span>尚差</span><b id="remaining">—</b><small>次</small></div>
      </div>
      <h2 class="systems-title">各檢索系統累積統計</h2>
      <div id="systems" class="systems"></div>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
